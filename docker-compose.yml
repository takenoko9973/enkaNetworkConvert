services:
    EnkaNetwork-translate:
        build:
            context: .
            dockerfile: .devcontainer/Dockerfile
        container_name: enka-network-translate
        working_dir: /workspace
        volumes:
            # node_modulesディレクトリはホスト側に渡さないようにDockerのvolume内に格納
            - ./:/workspace
            - node-modules:/workspace/node_modules
        tty: true

volumes:
    node-modules:
